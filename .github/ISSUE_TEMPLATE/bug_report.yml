name: Bug Report
description: Report an issue, incorrect calculation, or regression.
title: "[BUG] <Short bug description>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify against [11 — Glossary](docs/11-glossary.md) and expected calculation outputs before reporting.
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Component
      options:
        - "Backend (.NET API)"
        - "Frontend (React Web)"
        - "AI Service (Python FastAPI)"
        - "Database / Migrations"
        - "CI/CD / Staging"
        - "Documentation / Spec"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to docs/05-features-mvp.md or docs/07-api-contract.md?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred (include error envelopes or screenshots)?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or curl/API payloads to reproduce.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
