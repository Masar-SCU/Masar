name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Backend Build, Lint & Tests (.NET 10)
  # =========================================================================
  backend:
    name: .NET API (Build, Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/Masar.sln

      - name: Verify Code Formatting
        run: dotnet format src/backend/Masar.sln --verify-no-changes

      - name: Build Solution
        run: dotnet build src/backend/Masar.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test src/backend/Masar.sln --no-build --configuration Release --verbosity normal

  # =========================================================================
  # 2. Frontend Lint, Typecheck & Build (React 19 + TypeScript)
  # =========================================================================
  frontend:
    name: React Web (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: src/frontend
        run: npm run lint

      - name: TypeScript Compile Check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Run Tests
        working-directory: src/frontend
        run: npm test

      - name: Build Web Bundle
        working-directory: src/frontend
        run: npm run build

  # =========================================================================
  # 3. AI Service Lint & Tests (Python 3.12)
  # =========================================================================
  ai-service:
    name: Python AI (Lint & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/ai/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r src/ai/requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src/ai

      - name: Run Pytest
        working-directory: src/ai
        run: pytest
