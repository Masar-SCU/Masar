name: AI Service Smoke Test

on:
  pull_request:
    paths:
      - "src/ai/**"
      - ".github/workflows/ai-service-smoke-test.yml"

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t masar-ai:test ./src/ai

      - name: Start container
        run: docker run -d --name masar-ai-test -p 8000:8000 masar-ai:test

      - name: Test health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done

          docker logs masar-ai-test
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f masar-ai-test || true
